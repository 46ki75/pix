min_version: 2.1.14
lefthook: mise exec -- pnpm exec lefthook
glob_matcher: doublestar

output:
  - summary
  - success
  - failure
  - skips

fmt:
  files: git ls-files
  jobs:
    - &oxfmt
      name: oxfmt
      glob: "**/*.{ts,tsx,js,jsx,mjs,cjs,json,jsonc}"
      exclude: ".mise/locks/**"
      run: pnpm exec oxfmt --write {files}

fmt-check:
  files: git ls-files
  jobs:
    - <<: *oxfmt
      run: pnpm exec oxfmt --check {files}

lint:
  files: git ls-files
  jobs:
    - &oxlint
      name: oxlint
      glob: "**/*.{ts,tsx,js,jsx,mjs,cjs}"
      run: pnpm exec oxlint {files}

pre-commit:
  jobs:
    - <<: *oxfmt
      run: pnpm exec oxfmt --check {staged_files}
    - <<: *oxlint
      run: pnpm exec oxlint {staged_files}

commit-msg:
  jobs:
    - name: conventional-commit
      run: "head -n 1 \"{1}\" | grep -Eq '^(feat|fix|chore|test|refactor|docs)!?: [^[:space:]].*$'"
      fail_text: "Use type[!]: summary (feat, fix, chore, test, refactor, or docs)."
