packages:
  - packages/*

saveExact: true
verifyDepsBeforeRun: error

minimumReleaseAgeExclude:
  - '@earendil-works/chord@0.87.1'
  - '@earendil-works/pi-agent-core@0.87.1'
  - '@earendil-works/pi-ai@0.87.1'
  - '@earendil-works/pi-coding-agent@0.87.1'
  - '@earendil-works/pi-telemetry@0.87.1'
  - '@earendil-works/pi-tui@0.87.1'
allowBuilds:
  '@google/genai': false
  esbuild: true
  # Hook installation is an explicit step of `mise run setup`.
  lefthook: false
  protobufjs: false
patchedDependencies:
  # Fix conversion performance and fidelity in the runtime CJS and bundler-oriented
  # ES builds. The latter expects a bundler-provided require; Node/Pi uses the CJS entry.
  # Both variants are patched, with rendered-output and performance regressions.
  turndown@7.2.4: patches/turndown@7.2.4.patch
