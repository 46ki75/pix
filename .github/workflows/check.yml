name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install tools with mise
        uses: jdx/mise-action@v4
        with:
          version: "2026.9.9"
          install_args: node pnpm

      - name: Locate pnpm cache directories
        id: pnpm-cache
        run: |
          echo "store=$(pnpm store path)" >> "$GITHUB_OUTPUT"
          echo "metadata=$(pnpm cache path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm dependencies
        uses: actions/cache@v5
        with:
          path: |
            ${{ steps.pnpm-cache.outputs.store }}
            ${{ steps.pnpm-cache.outputs.metadata }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock', 'package.json', '**/package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'patches/**') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ runner.arch }}-

      - name: Install locked dependencies
        run: mise run setup

      - name: Check formatting, lint, types, and tests
        run: mise run check
