name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install tools with mise
        uses: jdx/mise-action@v4
        with:
          version: "2026.9.9"
          install_args: node pnpm

      - name: Locate pnpm cache directories
        id: pnpm-cache
        run: |
          echo "store=$(pnpm store path)" >> "$GITHUB_OUTPUT"
          echo "metadata=$(pnpm cache path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm dependencies
        uses: actions/cache@v5
        with:
          path: |
            ${{ steps.pnpm-cache.outputs.store }}
            ${{ steps.pnpm-cache.outputs.metadata }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock', 'package.json', '**/package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'patches/**') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ runner.arch }}-

      - name: Install locked dependencies
        run: mise run setup

      - name: Check formatting, lint, types, and tests
        run: mise run check

  windows-infrastructure:
    name: ${{ matrix.name }}
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows infrastructure
            shell: pwsh
            version: "7"
          - name: Windows PowerShell 5.1
            shell: powershell
            version: "5.1"
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Verify PowerShell host
        env:
          EXPECTED_POWERSHELL_VERSION: ${{ matrix.version }}
        run: |
          $version = $PSVersionTable.PSVersion.ToString()
          if (-not $version.StartsWith($env:EXPECTED_POWERSHELL_VERSION + '.')) {
            throw "Expected PowerShell $env:EXPECTED_POWERSHELL_VERSION, got $version"
          }
          $PSVersionTable | Format-Table -AutoSize

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install tools with mise
        uses: jdx/mise-action@v4
        with:
          version: "2026.9.9"
          install_args: node pnpm

      - name: Locate pnpm cache directories
        id: pnpm-cache
        run: |
          # Windows PowerShell defaults to UTF-16 redirection; Actions requires UTF-8.
          # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-commands#environment-files
          "store=$(pnpm store path)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "metadata=$(pnpm cache path)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Cache pnpm dependencies
        uses: actions/cache@v5
        with:
          path: |
            ${{ steps.pnpm-cache.outputs.store }}
            ${{ steps.pnpm-cache.outputs.metadata }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock', 'package.json', '**/package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'patches/**') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ runner.arch }}-

      - name: Install locked dependencies
        run: mise run setup

      - name: Check types
        run: mise run typecheck

      - name: Check portable pix-bg policy and UI
        run: mise run bg:test-portable

      - name: Check Windows execution, log security, and integration
        run: mise run test --project pix-bg
